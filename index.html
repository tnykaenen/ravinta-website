<head>

<title>Ravinta — Your personal eating coach</title>
<style>

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Literata', serif; }

  .feature p { color: var(--text-muted); font-size: 14px; line-height: 1.5; margin: 0; }
  .section-title { font-family: 'Bricolage Grotesque'; font-weight: 700; font-size: 26px; text-align: center; margin: 50px 0 24px; }
  .pricing { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
  .price-card { background: var(--receipt); color: var(--bg); border-radius: 14px; padding: 24px 30px; text-align: center; min-width: 200px; }
  .price-amount { font-family: 'Space Mono'; font-weight: 700; font-size: 22px; }
  .price-note { font-family: 'Space Mono'; font-size: 12px; opacity: 0.6; }
  .pricing-cta-wrap { text-align: center; margin-bottom: 8px; }
  .pricing-note { text-align: center; color: var(--text-muted); font-size: 13px; margin-bottom: 60px; }
  footer { border-top: 1px solid var(--line); padding: 24px 0; display: flex; justify-content: space-between; color: var(--text-muted); font-size: 13px; font-family: 'Space Mono'; flex-wrap: wrap; gap: 10px; }

<script>
  const translations = JSON.parse(document.getElementById('i18n-data').textContent);
  const select = document.getElementById('langSwitch');

  function getNested(obj, path) {
    return path.split('.').reduce((o, k) => (o || {})[k], obj);
  }

  function applyLang(lang) {
    const dict = translations[lang] || translations.en;
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      const val = getNested(dict, el.getAttribute('data-i18n'));
      if (val) el.textContent = val;
    });
    document.documentElement.lang = lang;
  }

  select.addEventListener('change', (e) => applyLang(e.target.value));

  const browserLang = (navigator.language || 'en').slice(0, 2);
  const initial = translations[browserLang] ? browserLang : 'en';
  select.value = initial;
  applyLang(initial);
</script>
